<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeZ</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Google AdSense Script (আপনার আসল AdSense Publisher ID বসাতে হবে) -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-app-pub-4929662786733228/3901350048" crossorigin="anonymous"></script>
    
    <style>
        :root { --bg: #0f0f13; --surface: #1c1c24; --primary: #ff0050; --secondary: #00f2fe; --text: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        #app { width: 100%; max-width: 480px; height: 100%; position: relative; display: flex; flex-direction: column; }
        .screen { display: none; flex: 1; overflow-y: auto; padding-bottom: 60px; }
        .screen.active { display: block; }
        .header { padding: 15px; background: var(--surface); display: flex; justify-content: space-between; align-items: center; position: sticky; top:0; z-index: 10; }
        .bottom-nav { position: absolute; bottom: 0; width: 100%; background: var(--surface); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #333; z-index: 100; }
        input, textarea, select { width: 100%; padding: 12px; margin: 10px 0; background: #2a2a35; border: none; color: white; border-radius: 8px; }
        button { width: 100%; padding: 12px; background: var(--primary); border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .post { height: 80vh; border-bottom: 1px solid #333; position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
        .ad-container { padding: 20px; text-align: center; background: #111; border-bottom: 1px solid #333; }
    </style>
</head>
<body>

<div id="app">
    <!-- Auth Screen -->
    <div id="auth-screen" class="screen active" style="padding: 30px;">
        <h1 style="color:var(--primary); text-align:center; font-size:40px; margin-bottom:20px;">VibeZ</h1>
        <div id="login-form">
            <h3>Login</h3>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button id="loginBtn">Login</button>
            <p style="margin-top:15px; text-align:center; color:var(--primary); cursor:pointer;" onclick="toggleAuth()">Create Account</p>
        </div>
        <div id="reg-form" style="display:none;">
            <h3>Register</h3>
            <input type="text" id="reg-name" placeholder="Full Name">
            <input type="email" id="reg-email" placeholder="Email">
            <input type="password" id="reg-pass" placeholder="Password">
            <button id="regBtn">Sign Up & Send Verification Mail</button>
            <p style="margin-top:15px; text-align:center; color:var(--primary); cursor:pointer;" onclick="toggleAuth()">Back to Login</p>
        </div>
    </div>

    <!-- Main Feed -->
    <div id="home-screen" class="screen">
        <div class="header">
            <h2>VibeZ</h2>
            <div><i class="fas fa-search" style="margin-right:15px;"></i><i class="fas fa-bell"></i></div>
        </div>
        <div id="feed">
            <!-- Posts and Ads will load here -->
        </div>
    </div>

    <!-- Bottom Nav -->
    <div id="bottom-nav" class="bottom-nav" style="display: none;">
        <i class="fas fa-home" onclick="showScreen('home-screen')"></i>
        <i class="fas fa-users" onclick="showScreen('group-screen')"></i>
        <i class="fas fa-plus" onclick="showScreen('post-screen')"></i>
        <i class="fas fa-wallet" onclick="showScreen('wallet-screen')"></i>
        <i class="fas fa-user" onclick="showScreen('profile-screen')"></i>
    </div>
</div>

<!-- Firebase SDK Integration -->
<script type="module">
    // আপনার Firebase Console থেকে নিচের কনফিগারেশন বসাতে হবে (এটি ফ্রি)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
    apiKey: "AIzaSyDO3kzFrx15ddlW71NY4fleV3OJvURdYlY",
    authDomain: "zang-510f5.firebaseapp.com",
    databaseURL: "https://zang-510f5-default-rtdb.firebaseio.com",
    projectId: "zang-510f5",
    storageBucket: "zang-510f5.firebasestorage.app",
    messagingSenderId: "598179392911",
    appId: "1:598179392911:web:932735df21757b060b6ffa"
  };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Auth Toggler
    window.toggleAuth = () => {
        const login = document.getElementById('login-form');
        const reg = document.getElementById('reg-form');
        login.style.display = login.style.display === 'none' ? 'block' : 'none';
        reg.style.display = reg.style.display === 'none' ? 'block' : 'none';
    };

    // Show Screens
    window.showScreen = (id) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    };

    // Real Email Registration
    document.getElementById('regBtn').addEventListener('click', async () => {
        const email = document.getElementById('reg-email').value;
        const pass = document.getElementById('reg-pass').value;
        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
            await sendEmailVerification(userCredential.user); // Send Real Mail
            alert("Verification Link sent to your Email! Please check your inbox, verify, and then login.");
            toggleAuth();
        } catch (error) { alert(error.message); }
    });

    // Login with Verification Check
    document.getElementById('loginBtn').addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        try {
            const userCredential = await signInWithEmailAndPassword(auth, email, pass);
            if (!userCredential.user.emailVerified) {
                alert("Please verify your email first! Check your inbox.");
                await signOut(auth); // Force sign out if not verified
                return;
            }
            alert("Login Successful!");
            document.getElementById('bottom-nav').style.display = 'flex';
            showScreen('home-screen');
            loadFeed();
        } catch (error) { alert("Invalid Credentials or User Not Found"); }
    });

    // Real-time Database Feed with Facebook-like Ads
    function loadFeed() {
        const q = query(collection(db, "posts"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            let postCount = 0;

            snapshot.forEach((doc) => {
                const data = doc.data();
                feed.innerHTML += `
                <div class="post">
                    <div style="position:absolute; bottom:20px; left:20px;">
                        <h3>@${data.author}</h3>
                        <p>${data.caption}</p>
                    </div>
                </div>`;
                
                postCount++;
                // Facebook-like Hidden Profit: প্রতি ৩টি পোস্টের পর একটি Google Ad দেখাবে
                if(postCount % 3 === 0) {
                    feed.innerHTML += `
                    <div class="ad-container">
                        <span style="font-size:10px; color:gray;">Advertisement</span>
                        <!-- AdSense Ad Code -->
                        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXX" data-ad-slot="XXX" data-ad-format="auto"></ins>
                    </div>`;
                    try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
                }
            });
        });
    }

    // Auto Check if User is already logged in & verified
    onAuthStateChanged(auth, (user) => {
        if (user && user.emailVerified) {
            document.getElementById('auth-screen').classList.remove('active');
            document.getElementById('bottom-nav').style.display = 'flex';
            showScreen('home-screen');
            loadFeed();
        }
    });

    // Backend Telegram API Trigger (Withdrawal Request)
    window.requestWithdraw = async (amount, address) => {
        // এই ফাংশনটি আমাদের Node.js/Telegram সার্ভারে রিকোয়েস্ট পাঠাবে
        fetch(`https://your-server.com/api/withdraw`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ email: auth.currentUser.email, amount: amount, address: address })
        }).then(res => alert("Withdraw request sent to Admin Telegram!"));
    }
</script>

</body>
</html>
